<h2>Register</h2>
<div id="login-message"></div>

<form action="login.html?msg=registered">
  <label>Name:</label><br>
  <input type="text"><br><br>
  <label>Email:</label><br>
  <input type="email"><br><br>
  <label>Password:</label><br>
  <input type="password"><br><br>
  <input type="submit" value="Register">
  <a href="login.html?msg=registered">Already have an account? Log in</a>
</form>

     <script>
  const params = new URLSearchParams(window.location.search);
  const message = params.get('msg');

  if (message === 'registered') {
    document.getElementById('login-message').textContent = '✓ You have successfully registered your account!';
    document.getElementById('login-message').style.color = 'green';
  } else if (message === 'signedin') {
    document.getElementById('login-message').textContent = '✓ You have successfully signed in!';
    document.getElementById('login-message').style.color = 'green';
  }
